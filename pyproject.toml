[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "repo-agent-bench"
version = "0.1.0"
description = "A/B test coding-agent workflows on your own repository with isolated worktrees and deterministic verification."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Uky0Yang" }
]
keywords = ["ai-agents", "coding-agents", "evals", "agent-skills", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.urls]
Homepage = "https://github.com/Uky0Yang/repo-agent-bench"
Issues = "https://github.com/Uky0Yang/repo-agent-bench/issues"
Source = "https://github.com/Uky0Yang/repo-agent-bench"

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.9,<1",
]

[project.scripts]
repo-agent-bench = "repo_agent_bench.cli:main"
rab = "repo_agent_bench.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-config --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py310"
